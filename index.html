/* ============ platform license layer ============ */
const CFG = window.HANDOFF_CONFIG || {};
const API = (CFG.BACKEND_URL || '').replace(/\/+$/, '');
const api = p => API ? API + p : p;
const LS_LIC = 'handoff.license.v1';
let licVal = (() => { try { return JSON.parse(localStorage.getItem(LS_LIC) || 'null'); } catch { return null; } })();
const licToken = () => licVal && licVal.license ? licVal.license : '';
const hasLicense = () => !!licToken();
async function licIssue(sid) {
  const url = api('/api/license/issue') + '?session_id=' + encodeURIComponent(sid);
  let r = null, lastErr = '';
  for (let i = 0; i < 6; i++) {
    try {
      r = await fetch(url);
      if (r.status !== 502 && r.status !== 503 && r.status !== 504) break;
      lastErr = 'backend waking up (HTTP ' + r.status + ')';
    } catch (e) { lastErr = 'backend unreachable'; r = null; }
    if (i < 5) { toast('Waking the license server\u2026 this can take a minute.'); await new Promise(res => setTimeout(res, 5000)); }
  }
  if (!r) throw new Error(lastErr);
  let d = {};
  try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(d.error || ('issue failed (HTTP ' + r.status + ')'));
  licVal = d; localStorage.setItem(LS_LIC, JSON.stringify(d));
  state.plan = 'pro'; save(); location.replace(baseURL());
}
let licTimer = null;
async function licRefresh() {
  if (!hasLicense()) return;
  try {
    const r = await fetch(api('/api/license/refresh'), { headers: { Authorization: 'Bearer ' + licToken() } });
    if (r.ok) {
      const d = await r.json();
      if (d.license) { licVal = d; localStorage.setItem(LS_LIC, JSON.stringify(d)); state.plan = 'pro'; }
      else { state.plan = 'free'; }
    } else if (r.status === 402 || r.status === 401) {
      localStorage.removeItem(LS_LIC); licVal = null; state.plan = 'free'; save(); route();
    }
  } catch { /* offline: keep current plan until next refresh */ }
  save();
}
function scheduleRefresh() { clearInterval(licTimer); if (hasLicense()) licTimer = setInterval(licRefresh, 6 * 3600 * 1000); }
let ckBusy = false;
async function platformCheckout() {
  if (ckBusy) return; ckBusy = true;
  toast('Connecting to secure checkout\u2026 first load after idle can take up to a minute.');
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 120000);
    const r = await fetch(api('/api/checkout'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}', signal: ctl.signal });
    clearTimeout(to);
    const d = await r.json();
    if (d.url) { top.location.href = d.url; return; }
    toast(d.error || 'Checkout unavailable \u2014 try again', 'err');
  } catch {
    toast('Checkout is slow to wake \u2014 retrying once\u2026');
    try {
      const r = await fetch(api('/api/checkout'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const d = await r.json();
      if (d.url) { top.location.href = d.url; return; }
    } catch {}
    toast('Could not start checkout. Please try again in a minute.', 'err');
  } finally { ckBusy = false; }
}

(function(){
