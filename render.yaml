# Render Blueprint — deploys handoff-api from this repo.
# "sync: false" values are asked in the dashboard when you create the service.
services:
  - type: web
    name: handoff-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        value: price_1UL8EKP11tr0MdT3HWEfXymJ
      - key: LICENSE_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false